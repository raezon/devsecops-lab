version: '3.8'

# ══════════════════════════════════════════════════════════════════════════════
# FIX CRITIQUE : DinD doit monter jenkins_home ET agent_workdir
# Sinon, quand Jenkins passe -v /var/jenkins_home/workspace/...:/workspace
# à DinD via TCP, DinD cherche ce chemin sur SON propre filesystem → fail silencieux
# Tous les rapports (Trivy, Gitleaks, ZAP) apparaissaient vides à cause de ça.
# ══════════════════════════════════════════════════════════════════════════════

services:

  dind:
    image: docker:26-dind
    container_name: jenkins_dind
    hostname: dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - dind_storage:/var/lib/docker
      - jenkins_home:/var/jenkins_home       # ← FIX #1 : partagé avec jenkins
      - agent_workdir:/home/jenkins/agent    # ← FIX #1 : partagé avec agent
    networks:
      devsecops-lab:
        aliases:
          - docker
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 20s
      timeout: 10s
      retries: 5

  vault:
    image: hashicorp/vault:1.15
    container_name: vault_server
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "myroot"
      VAULT_ADDR: "http://0.0.0.0:8200"
    networks:
      - devsecops-lab
    cap_add:
      - IPC_LOCK

  jenkins:
    build:
      context: .
      dockerfile: dockerfile
    container_name: jenkins_master
    hostname: jenkins
    depends_on:
      dind:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      JAVA_OPTS: >-
        -Xms512m
        -Xmx2g
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -Djenkins.install.runSetupWizard=false
        -Dhudson.model.UpdateCenter.never=true
        -Dcasc.jenkins.config=/var/jenkins_home/casc
      DOCKER_HOST: tcp://dind:2375
      VAULT_ADDR: ${VAULT_ADDR}
      VAULT_TOKEN: ${VAULT_TOKEN}
      JENKINS_ADMIN_USER: ${JENKINS_ADMIN_USER}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      REPORT_EMAIL: ${REPORT_EMAIL}
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./jenkins/casc:/var/jenkins_home/casc:ro
      - ./jenkins/init.groovy.d:/var/jenkins_home/init.groovy.d:ro
    networks:
      - devsecops-lab
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  agent:
    image: jenkins/inbound-agent:latest
    container_name: jenkins_agent
    hostname: agent
    depends_on:
      jenkins:
        condition: service_healthy
    environment:
      JENKINS_URL: http://jenkins:8080
      JENKINS_AGENT_NAME: docker-agent
      JENKINS_SECRET: ${JENKINS_AGENT_SECRET}
      JENKINS_AGENT_WORKDIR: /home/jenkins/agent
      DOCKER_HOST: tcp://dind:2375
      VAULT_ADDR: ${VAULT_ADDR}
      VAULT_TOKEN: ${VAULT_TOKEN}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      REPORT_EMAIL: ${REPORT_EMAIL}
    volumes:
      - agent_workdir:/home/jenkins/agent
    networks:
      - devsecops-lab
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  jenkins_home:
    driver: local
  agent_workdir:
    driver: local
  dind_storage:
    driver: local

networks:
  devsecops-lab:
    driver: bridge